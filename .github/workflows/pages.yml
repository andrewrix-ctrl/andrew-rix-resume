name: Deploy resume to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # NOTE: this workflow is not what publishes the site. Pages is set to
      # "Deploy from a branch", so GitHub's own Jekyll builder serves main and
      # _config.yml is what actually keeps these files off the public site.
      # Kept in sync in case the source is ever switched to GitHub Actions.
      - name: Keep design context out of the published site
        run: rm -rf PRODUCT.md DESIGN.md CLAUDE.md .impeccable
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
